<body>


<div class="bg one"></div>

<div class="bg two"></div>


<!-- =========================
     HEADER
========================= -->

<header class="resources-header">

    <div class="logo">

        <img
            src="assets/logo.png"
            alt="Rene The Teacher">

    </div>

</header>


<!-- =========================
     RESOURCES PAGE
========================= -->

<main class="resources-page">

    <div class="resources-layout">

        <!-- =========================
             LEFT: PAGE INTRODUCTION
        ========================= -->

        <section class="resources-heading">

            <div class="eyebrow">
                APRENDE TAMBIÉN FUERA DE CLASE
            </div>

            <h1>
                Recursos para
                <span>seguir aprendiendo.</span>
            </h1>

            <p>
                Tu progreso no debería detenerse cuando termina la clase.
                Aquí encontrarás recursos diseñados para ayudarte a practicar,
                repasar y seguir construyendo un inglés más natural en tu día a día.
            </p>

        </section>


        <!-- =========================
             RIGHT: RESOURCE CAROUSEL
        ========================= -->

        <section class="resources-carousel">

            <button class="resource-carousel-arrow resource-prev"
                aria-label="Recurso anterior">

                <i class="fa-solid fa-chevron-left"></i>

            </button>


            <div class="resource-carousel-window">

                <!--
                    Las tarjetas ya no se escriben aquí a mano.
                    script.js las genera automáticamente a partir
                    de resources-data.js en tiempo de carga.
                -->

                <div class="resource-carousel-track">
                </div>

            </div>


            <button
                class="resource-carousel-arrow resource-next"
                aria-label="Siguiente recurso">

                <i class="fa-solid fa-chevron-right"></i>

            </button>

        </section>

    </div>


    <!-- =========================
         INDICATORS
    ========================= -->

    <div class="resource-carousel-indicators">
    </div>


    <!-- =========================
         BACK HOME
    ========================= -->

    <a
        href="index.html"
        class="back-home-button">

        <i class="fa-solid fa-arrow-left"></i>

        Volver al inicio

    </a>
